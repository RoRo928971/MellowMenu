<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MELLOW Café &amp; Bar 計算アプリ</title>
  <style>
    :root {
      --bg-top: #1a1230;
      --bg-bottom: #2a1a45;
      --card: rgba(45, 32, 74, 0.72);
      --accent: #b794e6;
      --accent-dark: #9061c2;
      --gold: #e8c87a;
      --food: #c9a3f0;
      --drink: #7cc4e8;
      --text: #ece6f7;
      --muted: #a194c4;
      --border: rgba(183, 148, 230, 0.28);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "Hiragino Kaku Gothic ProN", "Yu Gothic", serif;
      background:
        radial-gradient(ellipse at top, rgba(120, 90, 180, 0.35), transparent 60%),
        linear-gradient(160deg, var(--bg-top), var(--bg-bottom));
      background-attachment: fixed;
      color: var(--text);
      padding: 16px;
      min-height: 100vh;
    }
    .container { max-width: 560px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 24px; }
    header h1 {
      font-size: 2rem;
      letter-spacing: 0.18em;
      margin: 8px 0 2px;
      color: #fff;
      text-shadow: 0 0 18px rgba(183, 148, 230, 0.7);
    }
    header .sub {
      font-size: 0.95rem;
      letter-spacing: 0.3em;
      color: var(--gold);
      margin: 0 0 6px;
    }
    header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.82rem;
      letter-spacing: 0.05em;
    }
    .section-title {
      text-align: center;
      font-weight: bold;
      letter-spacing: 0.3em;
      margin: 26px 0 12px;
      color: var(--gold);
      position: relative;
    }
    .section-title::before,
    .section-title::after {
      content: "✦";
      color: var(--accent);
      margin: 0 12px;
      font-size: 0.8em;
      vertical-align: middle;
    }
    .item {
      background: var(--card);
      backdrop-filter: blur(6px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 11px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
    }
    .item-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .item-info { display: flex; flex-direction: column; gap: 3px; }
    .item-name { font-weight: 600; font-size: 1.02rem; }
    .item-price { font-size: 0.82rem; color: var(--gold); }
    .item-desc { font-size: 0.72rem; color: var(--muted); }
    .item-count {
      flex-shrink: 0;
      min-width: 56px;
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
      color: #fff;
      line-height: 1.1;
    }
    .item-count small {
      display: block;
      font-size: 0.6rem;
      font-weight: normal;
      color: var(--muted);
      letter-spacing: 0.1em;
    }
    .qty {
      display: flex;
      gap: 6px;
      margin-top: 12px;
    }
    .qty button {
      flex: 1;
      min-width: 0;
      height: 40px;
      padding: 0;
      white-space: nowrap;
      border: none;
      border-radius: 9px;
      background: linear-gradient(145deg, var(--accent), var(--accent-dark));
      color: #fff;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      line-height: 1;
      box-shadow: 0 0 8px rgba(183, 148, 230, 0.35);
    }
    .qty button:active { filter: brightness(0.85); }
    .qty button.minus {
      background: rgba(255,255,255,0.08);
      color: var(--text);
      box-shadow: none;
    }
    .qty button.clear {
      flex: 0 0 44px;
      background: rgba(255,255,255,0.05);
      color: var(--muted);
      font-size: 0.7rem;
    }
    .badge {
      display: inline-block;
      width: 9px; height: 9px;
      border-radius: 50%;
      margin-right: 8px;
    }
    .badge.food { background: var(--food); box-shadow: 0 0 6px var(--food); }
    .badge.drink { background: var(--drink); box-shadow: 0 0 6px var(--drink); }
    .actions { display: flex; gap: 10px; margin-top: 24px; }
    .btn-calc {
      flex: 1;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(145deg, var(--accent), var(--accent-dark));
      color: #fff;
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 0.1em;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(183, 148, 230, 0.5);
    }
    .btn-calc:active { filter: brightness(0.88); }
    .btn-reset {
      padding: 15px 20px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255,255,255,0.06);
      color: var(--muted);
      font-size: 1rem;
      cursor: pointer;
    }
    .result {
      margin-top: 24px;
      background: var(--card);
      backdrop-filter: blur(6px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      display: none;
    }
    .result.show { display: block; }
    .result h2 {
      margin: 0 0 14px;
      font-size: 1rem;
      letter-spacing: 0.15em;
      color: var(--gold);
      text-align: center;
    }
    .result-line {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      padding: 5px 0;
    }
    .result-line .name { color: var(--muted); }
    .result-total {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed var(--border);
      font-weight: bold;
      letter-spacing: 0.05em;
    }
    .result-total .amount {
      font-size: 1.7rem;
      color: var(--gold);
      text-shadow: 0 0 12px rgba(232, 200, 122, 0.5);
    }
    .empty-msg { color: var(--muted); font-size: 0.9rem; text-align: center; }
    footer {
      text-align: center;
      margin-top: 28px;
      color: var(--muted);
      font-size: 0.7rem;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>MELLOW</h1>
      <p class="sub">✦ Café &amp; Bar ✦</p>
      <p>数量を選んで「計算する」を押してください</p>
    </header>

    <div class="section-title">フード</div>
    <div id="food-list"></div>

    <div class="section-title">ドリンク</div>
    <div id="drink-list"></div>

    <div class="actions">
      <button class="btn-calc" id="calcBtn">計算する</button>
      <button class="btn-reset" id="resetBtn">リセット</button>
    </div>

    <div class="result" id="result">
      <h2>✦ 注文内容 ✦</h2>
      <div id="result-details"></div>
      <div class="result-total">
        <span>合計金額</span>
        <span class="amount" id="total-amount">$0</span>
      </div>
    </div>

    <footer>MELLOW Café &amp; Bar</footer>
  </div>

  <script>
    // メニュー定義（MELLOW Café & Bar）
    const MENU = {
      food: [
        { id: 'f1', name: 'スイーツプレート', price: 35000, desc: '空腹回復 大' },
        { id: 'f2', name: 'ランチプレート',   price: 25000, desc: '空腹回復 中' },
        { id: 'f3', name: 'おつまみプレート', price: 25000, desc: '空腹回復 中' },
        { id: 'f4', name: 'スイーツボックス', price: 45000, desc: '空腹回復 小 ・ ストレス回復' },
      ],
      drink: [
        { id: 'd1', name: 'メロンソーダ',         price: 12500, desc: '水分回復 中' },
        { id: 'd2', name: 'カプチーノ',           price: 12500, desc: '水分回復 中' },
        { id: 'd3', name: 'キス・イン・ザ・ダーク', price: 35000, desc: '水分回復 小 ・ ストレス回復' },
        { id: 'd4', name: 'バイオレットフィズ',    price: 17500, desc: '水分回復 大' },
      ],
    };

    const quantities = {};

    function renderItems(items, containerId, badgeClass) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      items.forEach(item => {
        quantities[item.id] = 0;
        const row = document.createElement('div');
        row.className = 'item';
        row.innerHTML = `
          <div class="item-head">
            <div class="item-info">
              <span class="item-name"><span class="badge ${badgeClass}"></span>${item.name}</span>
              <span class="item-price">$${item.price.toLocaleString()}</span>
              <span class="item-desc">${item.desc}</span>
            </div>
            <div class="item-count"><span id="qty-${item.id}">0</span><small>個</small></div>
          </div>
          <div class="qty">
            <button class="clear" data-id="${item.id}" data-set="0">クリア</button>
            <button class="plus" data-id="${item.id}" data-delta="1">＋1</button>
            <button class="plus" data-id="${item.id}" data-delta="5">＋5</button>
            <button class="plus" data-id="${item.id}" data-delta="10">＋10</button>
            <button class="plus" data-id="${item.id}" data-delta="50">＋50</button>
          </div>`;
        container.appendChild(row);
      });
    }

    function updateQty(id, value) {
      let v = parseInt(value, 10);
      if (isNaN(v) || v < 0) v = 0;
      quantities[id] = v;
      document.getElementById('qty-' + id).textContent = v;
    }

    function calculate() {
      const all = [...MENU.food, ...MENU.drink];
      let total = 0;
      const lines = [];
      all.forEach(item => {
        const qty = quantities[item.id] || 0;
        if (qty > 0) {
          const subtotal = qty * item.price;
          total += subtotal;
          lines.push(`
            <div class="result-line">
              <span class="name">${item.name} × ${qty}</span>
              <span>$${subtotal.toLocaleString()}</span>
            </div>`);
        }
      });

      const details = document.getElementById('result-details');
      details.innerHTML = lines.length
        ? lines.join('')
        : '<p class="empty-msg">商品が選択されていません。</p>';
      document.getElementById('total-amount').textContent = '$' + total.toLocaleString();
      document.getElementById('result').classList.add('show');
    }

    function reset() {
      Object.keys(quantities).forEach(id => updateQty(id, 0));
      document.getElementById('result').classList.remove('show');
    }

    // 初期化
    renderItems(MENU.food, 'food-list', 'food');
    renderItems(MENU.drink, 'drink-list', 'drink');

    // イベント（増減・クリアボタン）
    document.body.addEventListener('click', e => {
      const btn = e.target.closest('button[data-id]');
      if (!btn) return;
      const id = btn.dataset.id;
      if (btn.dataset.set !== undefined) {
        updateQty(id, parseInt(btn.dataset.set, 10));
      } else if (btn.dataset.delta !== undefined) {
        updateQty(id, (quantities[id] || 0) + parseInt(btn.dataset.delta, 10));
      }
    });

    document.getElementById('calcBtn').addEventListener('click', calculate);
    document.getElementById('resetBtn').addEventListener('click', reset);
  </script>
</body>
</html>
